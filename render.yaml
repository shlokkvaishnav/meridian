services:
  - type: web
    name: meridian-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run prisma:generate -w backend && npm run prisma:migrate:deploy -w backend && npm run build -w frontend
    startCommand: npm run start -w frontend
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) — never commit
      # real values here. See .env.example for what each one does.
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
